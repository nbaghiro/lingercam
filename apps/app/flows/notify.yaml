# Back from a deep link lands on the events list, and the notification card on the event screen:
# not asked yet, it gives the reason and Turn on shows the system prompt; with notifications off
# for LingerCam it points to Settings. Each part starts from a clean install state so the per-event
# answers from earlier runs don't hide the card. The simulator can't preset the notification
# permission, so the system prompt sets it, and Maestro answers that prompt with the
# NOTIFICATIONS value open.yaml launches with.
appId: app.galleo.linger
---
- launchApp:
    clearState: true
- runFlow:
    file: open.yaml
    env:
      NOTIFICATIONS: deny
- runFlow:
    when:
      visible: "Continue with email"
    commands:
      - runFlow: signin.yaml
- extendedWaitUntil:
    visible: "Your events"
    timeout: 20000

# A deep link opens the event with the events list under it.
- openLink: linger://e/EMMADN
# The reveal moment covers the screen the first time this device opens the event.
- extendedWaitUntil:
    visible: "See every moment|Emma & Daniel's Wedding day"
    timeout: 20000
- runFlow:
    when:
      visible: "See every moment"
    commands:
      - tapOn: "See every moment"
- tapOn: "Back"
- assertVisible: "Your events"

# Not asked yet: the card gives the reason, and Turn on shows the system prompt, denied here.
- openLink: linger://e/MAYA3X
- extendedWaitUntil:
    visible: "We'll tell you when the photos are ready."
    timeout: 20000
- tapOn: "Turn on"
- extendedWaitUntil:
    notVisible: "We'll tell you when the photos are ready."
    timeout: 10000
- tapOn: "Back"

# Notifications now off: another event's card says how to turn them on and is gone after Not now.
- openLink: linger://e/JNHSWM
- extendedWaitUntil:
    visible: "Notifications are off for LingerCam.*"
    timeout: 20000
- assertVisible: "Open Settings"
- tapOn: "Not now"
- assertNotVisible: "Notifications are off for LingerCam.*"

# Allowed from the prompt: the card goes away.
- launchApp:
    clearState: true
- runFlow:
    file: open.yaml
    env:
      NOTIFICATIONS: allow
- openLink: linger://e/JNHSWM
- extendedWaitUntil:
    visible: "We'll tell you when the photos are ready."
    timeout: 20000
- tapOn: "Turn on"
- extendedWaitUntil:
    notVisible: "We'll tell you when the photos are ready."
    timeout: 10000
