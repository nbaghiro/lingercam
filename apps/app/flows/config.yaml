# `maestro test flows` runs these in order. open.yaml and signin.yaml are shared steps,
# not flows of their own.
# manage.yaml changes and deletes GAMENT, so it runs last and needs a fresh seed before a rerun.
flows:
  - host.yaml
  - guest.yaml
  - uploads.yaml
  - gallery.yaml
  - notify.yaml
  - manage.yaml
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - host
    - guest
    - uploads
    - gallery
    - notify
    - manage
