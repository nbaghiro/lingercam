# Opens the revealed wedding as its host, scrolls the gallery, views a photo, hides it and undoes
# that, closes the viewer with a swipe down, plays the recap to its end card and saves every
# photo into an album named after the event.
appId: app.lingercam
---
- runFlow: open.yaml
- runFlow:
    when:
      visible: "Continue with email"
    commands:
      - runFlow: signin.yaml
- extendedWaitUntil:
    visible: "Your events"
    timeout: 20000
- openLink: linger://e/EMMADN
# The reveal moment covers the screen the first time this device opens the event.
- extendedWaitUntil:
    visible: "See every moment|Emma & Daniel's Wedding day"
    timeout: 20000
- runFlow:
    when:
      visible: "See every moment"
    commands:
      - tapOn: "See every moment"
- extendedWaitUntil:
    visible: "Photo by .*"
    timeout: 20000
- scroll
- scroll
# Back to the top, so the first tile is on screen when it is tapped.
- scrollUntilVisible:
    element: "Watch the recap"
    direction: UP
- tapOn:
    text: "Photo by .*"
    index: 0
- extendedWaitUntil:
    visible: ".* of 24"
    timeout: 10000
- swipe:
    direction: LEFT

# Hide is immediate and can be undone from the toast.
- tapOn: "More"
- tapOn: "Hide photo"
- assertVisible: "Hidden from guests."
- tapOn: "Undo"
- assertNotVisible: "Hidden from guests."

# A swipe down closes the viewer.
- swipe:
    start: 50%, 40%
    end: 50%, 90%
    duration: 300
- extendedWaitUntil:
    visible: "Emma & Daniel's Wedding day"
    timeout: 10000

# The recap plays the server's picks and ends on a card.
- scrollUntilVisible:
    element: "Watch the recap"
    direction: UP
- tapOn: "Watch the recap"
- extendedWaitUntil:
    visible: "The whole night in .* seconds"
    timeout: 10000
- repeat:
    times: 12
    commands:
      - tapOn:
          point: 90%, 50%
- extendedWaitUntil:
    visible: "Watch again"
    timeout: 10000
- tapOn: "See every moment"
- assertVisible: "Emma & Daniel's Wedding day"

# Download all asks for Photos once, then saves every photo into the event's album.
- tapOn: "Save all photos"
- runFlow:
    when:
      visible: "Allow Full Access"
    commands:
      - tapOn: "Allow Full Access"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- extendedWaitUntil:
    visible: "24 photos saved to Photos.*"
    timeout: 120000
- launchApp:
    appId: com.apple.mobileslideshow
# Photos shows its first-run screen once per simulator.
- runFlow:
    when:
      visible: "What.s New in Photos"
    commands:
      - tapOn: "Continue"
- tapOn: "Collections"
- scrollUntilVisible:
    element: "Emma & Daniel's Wedding day"
    direction: DOWN
- assertVisible: "Emma & Daniel's Wedding day"
