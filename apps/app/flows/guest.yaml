# A guest opens the seeded live birthday from its link, joins and shoots, checks the camera's
# tools, then leaves and comes back. Also opens a code by hand and the seeded states the join
# sheet has: before the start, right-away while shooting, a draft, ended and revealed.
appId: app.galleo.linger
---
- runFlow: open.yaml
# A guest, so the demo host from host.yaml signs out first.
- runFlow:
    when:
      visible: "Your events"
    commands:
      - tapOn: "Settings"
      - scrollUntilVisible:
          element: "Sign out"
      - tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Continue as demo host"
    timeout: 20000

# Have a code? on the welcome or home screen takes a typed code.
- runFlow:
    when:
      visible: "Have a code?"
    commands:
      # Welcome opens the code field in a sheet; the events list shows it inline.
      - runFlow:
          when:
            notVisible: "Join code"
          commands:
            - tapOn: "Have a code?"
      - tapOn: "Join code"
      - inputText: "maya3x"
      - extendedWaitUntil:
          visible: "You're invited to shoot Maya turns thirty"
          timeout: 20000

- openLink: linger://j/MAYA3X
- extendedWaitUntil:
    visible: "You're invited to shoot Maya turns thirty"
    timeout: 20000
- assertVisible: "Alex invited you"
- assertVisible: "Photos come from this camera only."
# The sheet grows into its content first.
- waitForAnimationToEnd
- tapOn: "Open camera|Join as .*"
- runFlow:
    when:
      visible: "What should we call you?"
    commands:
      - tapOn: "Your name"
      - inputText: "Robin"
      - tapOn: "Continue"
# Continue goes straight to the camera: no "Allow the camera" step before the system prompt.
- assertNotVisible: "Allow the camera"
- extendedWaitUntil:
    visible: "\\d+ shots? left"
    timeout: 20000
- copyTextFrom: "\\d+ shots? left"
- evalScript: ${output.before = parseInt(maestro.copiedText, 10)}

# Flash cycles Auto, On, Off and is remembered when the camera opens again.
- assertVisible:
    text: "Flash"
- tapOn: "Flash"
- tapOn: "Flash"

- tapOn: "Take photo"
- waitForAnimationToEnd
- tapOn: "Take photo"
- waitForAnimationToEnd
- copyTextFrom: "\\d+ shots? left"
- assertTrue: ${parseInt(maestro.copiedText, 10) === output.before - 2}

# The last shot stays on the thumbnail after leaving and reopening the camera.
- tapOn: "That was your last photo. See the event|See the event\\. \\d+ photos? (is|are) still sending"
# The developing grid is one element for VoiceOver.
- extendedWaitUntil:
    visible: "\\d+ photos? developing"
    timeout: 20000
- openLink: linger://e/MAYA3X/camera
- extendedWaitUntil:
    visible: "\\d+ shots? left"
    timeout: 20000
- assertVisible: "That was your last photo. See the event|See the event\\. \\d+ photos? (is|are) still sending"
- assertVisible: "Flash"

# The join sheet's other states, from the seed.
- openLink: linger://j/SATWED
- extendedWaitUntil:
    visible: "The camera opens .*"
    timeout: 20000
# A new guest joins now; the demo host from host.yaml already has a place and sees the event.
- assertVisible: "Join now|Join as .*|See the event"
# A right-away event shows photos from its start and still invites guests to shoot.
- openLink: linger://j/BRNCH5
- extendedWaitUntil:
    visible: "You're invited to shoot Sunday brunch"
    timeout: 20000
- openLink: linger://j/TFNWKD
- extendedWaitUntil:
    visible: ".* isn't open yet"
    timeout: 20000
- assertVisible: "Try again"
- openLink: linger://j/JNHSWM
- extendedWaitUntil:
    visible: "The camera has closed"
    timeout: 20000
- assertVisible: "See the event"
- openLink: linger://j/EMMADN
- extendedWaitUntil:
    visible: "The photos are ready|These photos are for the people who were there"
    timeout: 20000
