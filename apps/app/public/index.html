<!doctype html>
<html lang="%LANG_ISO_CODE%">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>%WEB_TITLE%</title>
        <meta
            name="description"
            content="Join an event's shared camera in your browser. Photos stay hidden until the reveal, then everyone gets them at the same time."
        />
        <meta name="color-scheme" content="dark" />
        <meta name="apple-mobile-web-app-title" content="Linger" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <!-- The react-native-web root element reset, on Night so nothing flashes white. -->
        <style id="expo-reset">
            html,
            body {
                height: 100%;
                background-color: #0d0d0d;
            }
            body {
                overflow: hidden;
            }
            #root {
                display: flex;
                height: 100%;
                flex: 1;
            }
        </style>
    </head>

    <body>
        <noscript>Linger needs JavaScript to open the camera. Turn it on and reload the page.</noscript>
        <div id="root"></div>
    </body>
</html>
