# Render blueprint. Secrets marked sync: false are entered in the dashboard.
# Postgres is on Neon (AWS us-east-2, next to Render's Ohio region); photos are on Cloudflare R2.
# The steps to set it all up are in .docs/deployment.md.
envVarGroups:
  - name: linger-backend
    envVars:
      - key: NODE_VERSION
        value: "26"
      - key: NODE_ENV
        value: production
      # Neon's direct connection string (the host without "-pooler"), with sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: API_URL
        value: https://api.lingercam.app
      - key: SITE_URL
        value: https://lingercam.app
      - key: JOIN_URL
        value: https://join.lingercam.app
      - key: SESSION_SECRET
        generateValue: true
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: linger
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        value: LingerCam <hello@lingercam.app>
      # The App Review login: an email and a fixed six-digit code, no email sent.
      - key: REVIEW_EMAIL
        sync: false
      - key: REVIEW_CODE
        sync: false
      - key: MODERATION_EMAIL
        value: support@galleo.app
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: REVENUECAT_SECRET_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_AUTH
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

services:
  # Requests only: it sends jobs but runs none. One instance until the rate limiter moves to
  # Postgres (F11), then autoscaling can go on.
  - type: web
    name: linger-api
    runtime: node
    region: ohio
    plan: standard
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    preDeployCommand: pnpm --filter api db:migrate
    startCommand: pnpm --filter api start
    healthCheckPath: /health
    maxShutdownDelaySeconds: 60
    domains:
      - api.lingercam.app
    envVars:
      - fromGroup: linger-backend
      - key: ROLE
        value: api
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ORIGINS
        value: https://join.lingercam.app,https://lingercam.app

  # The job handlers, the crons and developing photos with sharp.
  - type: worker
    name: linger-worker
    runtime: node
    region: ohio
    plan: standard
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter api start
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: linger-backend
      - key: ROLE
        value: worker

  - type: web
    name: linger-site
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter site build
    staticPublishPath: apps/site/dist
    domains:
      - lingercam.app
    envVars:
      - key: NODE_VERSION
        value: "26"
      # The nav's App Store button; until the listing exists it goes to /support/#get-the-app.
      - key: PUBLIC_APP_STORE_URL
        sync: false

  - type: web
    name: linger-join
    runtime: static
    buildCommand: >-
      corepack enable && pnpm install --frozen-lockfile &&
      pnpm --filter app exec expo export --platform web
    staticPublishPath: apps/app/dist
    domains:
      - join.lingercam.app
    # Files in the build are served as they are; these rules cover every other path, in order.
    # A shared /<code> link goes to the API, which returns index.html with the event's preview
    # tags. The app's own one-segment routes skip that trip.
    routes:
      - type: rewrite
        source: /new
        destination: /index.html
      - type: rewrite
        source: /settings
        destination: /index.html
      - type: rewrite
        source: /:code
        destination: https://api.lingercam.app/v1/e/:code/page
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /.well-known/apple-app-site-association
        name: Content-Type
        value: application/json
    envVars:
      - key: NODE_VERSION
        value: "26"
      - key: EXPO_PUBLIC_API_URL
        value: https://api.lingercam.app
      - key: EXPO_PUBLIC_JOIN_URL
        value: https://join.lingercam.app
      - key: EXPO_PUBLIC_SITE_URL
        value: https://lingercam.app
