packages:
  - "apps/*"
  - "packages/*"

# One version of each native module: Expo supports a single React Native version per monorepo.
# Expo and React pins match ../smallwares so both repos move together.
catalog:
  expo: ~58.0.21
  expo-application: ~58.1.2
  expo-constants: ~58.0.14
  expo-dev-client: ~58.0.17
  expo-font: ~58.0.11
  expo-haptics: ~58.0.7
  expo-linking: ~58.0.15
  expo-localization: ~58.0.5
  expo-notifications: ~58.1.7
  expo-router: ~58.0.28
  expo-splash-screen: ~58.0.12
  expo-status-bar: ~58.0.4
  expo-system-ui: ~58.0.7
  expo-updates: ~58.0.19
  expo-web-browser: ~58.0.7
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.1
  react-native-gesture-handler: ~3.3.0
  react-native-reanimated: 4.7.1
  react-native-safe-area-context: ~5.10.1
  react-native-screens: ~4.30.0
  react-native-worklets: 0.13.0
  "@shopify/react-native-skia": 2.14.0
  react-native-mmkv: 4.3.2
  react-native-nitro-modules: 0.37.1
  react-native-purchases: 10.16.0
  intl-messageformat: 12.1.4
  "@types/react": ~19.3.0
  typescript: ~6.0.3
  vitest: ^5.0.5
  zod: ^4.6.7

onlyBuiltDependencies:
  - esbuild
  - sharp
